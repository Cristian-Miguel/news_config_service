eureka:
  client:
    register-with-eureka: false
    service-url:
      defaultZone: EUREKA_DEFAULT_ZONE

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**, /api/role/**, /api/admin/**

        - id: news-service
          uri: lb://news-service
          predicates:
            - Path=/api/news/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notification/**

        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/search/**

        - id: subscription-service
          uri: lb://subscription-service
          predicates:
            - Path=/api/subscription/**

gateway:
  security:
    white-list: # Rutas Públicas
      - /api/auth/sign_in
      - /api/auth/sign_up
      - /api/auth/refresh_token
      - /api/news/public/**
      - /api/search/**
    
    role-constraints:
      # --- AUTH SERVICE ---
      - path: /api/auth/sign_out
        method: POST
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_JOURNALIST, ROLE_READERS, ROLE_PREMIUM, ROLE_NEWS_ENTERPRICE]
      - path: /apiauth/sign_out_all
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_JOURNALIST, ROLE_READERS, ROLE_PREMIUM, ROLE_NEWS_ENTERPRICE]
      - path: /api/auth/validate
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_JOURNALIST, ROLE_READERS, ROLE_PREMIUM, ROLE_NEWS_ENTERPRICE]
      - path: /api/auth/validate_email
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_JOURNALIST, ROLE_READERS, ROLE_PREMIUM, ROLE_NEWS_ENTERPRICE]
      - path: /api/auth/verified_email
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_JOURNALIST, ROLE_READERS, ROLE_PREMIUM, ROLE_NEWS_ENTERPRICE]
      - path: /api/auth/reset_password_validated
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_JOURNALIST, ROLE_READERS, ROLE_PREMIUM, ROLE_NEWS_ENTERPRICE]

      # --- USER SERVICE ---
      - path: /api/user
        method: POST
        roles: [ROLE_ADMINISTRATOR, ROLE_NEWS_ENTERPRICE]
      - path: /api/user
        method: PUT
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_JOURNALIST, ROLE_READERS, ROLE_PREMIUM, ROLE_NEWS_ENTERPRICE]
      - path: /api/user
        method: GET
        roles: [ROLE_ADMINISTRATOR, ROLE_NEWS_ENTERPRICE]
      - path: /api/user/{uuid}
        method: GET
        roles: [ROLE_ADMINISTRATOR, ROLE_NEWS_ENTERPRICE]
      - path: /api/user/{uuid}
        method: DELETE
        roles: [ROLE_ADMINISTRATOR, ROLE_NEWS_ENTERPRICE]
      
      # --- ROLES & ADMIN ---
      - path: /api/roles/**
        roles: [ROLE_ADMINISTRATOR]
      - path: /api/admin/**
        roles: [ROLE_ADMINISTRATOR]

      # --- NEWS SERVICE ---
      - path: /api/news
        method: POST
        roles: [ROLE_ADMINISTRATOR, ROLE_JOURNALIST, ROLE_PUBLISHER, ROLE_NEWS_ENTERPRICE]
      - path: /api/news
        method: PUT
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_NEWS_ENTERPRICE]
      - path: /api/news/{uuid}
        method: DELETE
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_NEWS_ENTERPRICE]
      # GET /api/news suele ser público o para todos los autenticados:
      - path: /api/news/**
        method: GET
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_JOURNALIST, ROLE_READERS, ROLE_PREMIUM, ROLE_NEWS_ENTERPRICE]

      # --- SUBSCRIPTION SERVICE ---
      - path: /api/susbcription
        method: POST
        roles: [ROLE_ADMINISTRATOR]
      - path: /api/susbcription/user/{uuid}
        method: GET
        roles: [ROLE_ADMINISTRATOR, ROLE_NEWS_ENTERPRICE, ROLE_PREMIUM, ROLE_READERS]
      
      # --- NOTIFICATION SERVICE ---
      - path: /api/notification
        method: POST
        roles: [ROLE_ADMINISTRATOR, ROLE_PUBLISHER, ROLE_NEWS_ENTERPRICE]

server:
  port: API_GATEWAY_PORT

jwt:
  secret-key: JWT_SECRET
  internal-secret-key: JWT_INTERNAL_SECRET
  expired-date: JWT_INTERNAL_EXPIRED

microservice:
  auth_service: AUTH_ROUTE
  user_service: USER_ROUTE
  news_service: NEWS_ROUTE
  notification_service: NOTIFICATION_ROUTE
  search_service: SEARCH_ROUTE
  subscription_service: SUBSCRIPTION_ROUTE

logging:
  level:
    org.springframework.boot.context.properties: DEBUG
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
    
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"