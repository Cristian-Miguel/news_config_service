eureka:
  instance:
    hostname: EUREKA_HOSTNAME
  client:
    service-url:
      defaultZone: EUREKA_DEFAULT_ZONE

server:
  port: USER_PORT

spring:
  application:
    name: user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: USER_DB_ROUTE
    username: USER_DB_USER
    password: USER_DB_PASSWORD
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  kafka:
    bootstrap-servers: KAFKA_BOOTSTRAP_SERVERS
    properties:
      security.protocol: SSL
      ssl.endpoint.identification.algorithm: ""
    listener:
      observation-enabled: true
    producer:
      bootstrap-servers: KAFKA_PRODUCER_BOOTSTRAP_SERVERS
      key-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: KAFKA_CONSUMER_BOOTSTRAP_SERVERS
      group-id: USER_KAFKA_GROUP_ID
      key-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    ssl:
      key-store-type: JKS
      trust-store-type: JKS
      protocol: TLSv1.3
      enabled.protocols: TLSv1.2,TLSv1.3
      trust-store-location: USER_KAFKA_TRUSTSTORE_ROUTE
      trust-store-password: KAFKA_TRUSTSTORE_CREDS
      key-store-location: USER_KAFKA_KEYSTORE_ROUTE
      key-store-password: KAFKA_KEYSTORE_CREDS
      key-password: KAFKA_KEY_CREDS
      endpoint:
        identification:
          algorithm: ""
      enabled:
        protocols: TLSv1.2,TLSv1.3

jwt:
  secret-key: JWT_SECRET
  expired-date: JWT_EXPIRED
  expired-date-refresh: JWT_EXPIRED_REFRESH

crypto:
  secret-key: CRYPTO_SECRET
  salt: SALT_SECRET

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
      hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
    # Uncomment if Kafka logging is needed
    # org.apache.kafka: DEBUG
    # kafka: DEBUG
    # org.springframework.kafka: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
